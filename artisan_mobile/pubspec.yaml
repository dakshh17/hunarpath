name: artisan_mobile
description: ShilpSetu – Zero-text audio-first mobile app for rural artisans.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking
  http: ^1.2.0
  http_parser: ^4.0.0

  # Camera & media
  image_picker: ^1.0.0
  path_provider: ^2.1.0

  # Audio record & playback
  record: ^7.1.1
  audioplayers: ^6.0.0

  # State management
  provider: ^6.1.0

  # UI utilities
  cupertino_icons: ^1.0.6
  flutter_tts: ^4.0.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  percent_indicator: ^4.2.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  path_provider_android: 2.2.15

flutter:
  uses-material-design: true
